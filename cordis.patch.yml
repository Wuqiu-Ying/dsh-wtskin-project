# dsh-wtskin-project bundle patch (v3)
#
# One bundle provides three things:
#   1. the Host plugin (tools, engine, panel bridge)
#   2. the Agent preset「战雷画涂装模式」— registered by the Host plugin at
#      activation through ctx.agentPresets, the same path other profile
#      bundles use (a bare @deepseek-ai/dsh-agent-preset row was accepted by
#      the loader here but never reached the Web roster)
#   3. (the Client half travels with the package's `dsh.client` section)
#
# Install with the plugin manager (recommended) or:
#   dsh plugin --profile <profile> add link:<absolute path to this folder>
- insert:
    - id: dsh-wtskin-project
      name: dsh-wtskin-project
